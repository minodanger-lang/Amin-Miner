name: Android APK Build

on:
  push:
    branches: [main, verus-engine-review]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verus-engine-arm64:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout pinned engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build VerusHash engine for Android arm64
        run: bash scripts/build-verus-engine-android.sh

      - name: Upload ARM64 engine and trusted CA bundle
        uses: actions/upload-artifact@v4
        with:
          name: amin-verus-engine-arm64
          path: dist/verus-arm64/
          if-no-files-found: error

  build-debug-apk:
    needs: build-verus-engine-arm64
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download verified ARM64 engine artifact
        uses: actions/download-artifact@v4
        with:
          name: amin-verus-engine-arm64
          path: dist/verus-arm64

      - name: Package engine assets and GPL notices
        run: |
          mkdir -p app/src/main/assets/verus-engine app/src/main/jniLibs/arm64-v8a
          cp dist/verus-arm64/libprimo.so app/src/main/jniLibs/arm64-v8a/
          cp dist/verus-arm64/cacert.pem app/src/main/assets/verus-engine/
          cp dist/verus-arm64/libc++_shared.so app/src/main/jniLibs/arm64-v8a/
          cp vendor/primo-arm-miner/LICENSE app/src/main/assets/verus-engine/
          cp vendor/primo-arm-miner/NOTICE app/src/main/assets/verus-engine/
          cp vendor/primo-arm-miner/PROVENANCE.md app/src/main/assets/verus-engine/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install build packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify packaged ARM64 miner and TLS assets
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libprimo.so|lib/arm64-v8a/libc\+\+_shared.so|assets/verus-engine/cacert.pem|assets/verus-engine/LICENSE'
          mkdir -p /tmp/amin-apk-check
          unzip -p "$APK" lib/arm64-v8a/libprimo.so > /tmp/amin-apk-check/libprimo.so
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h /tmp/amin-apk-check/libprimo.so | grep -q 'Machine:.*AArch64'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: amin-miner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
